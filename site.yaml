      - { nombre: Estiércol de oveja, texto: "Saco de 25 kilos, bien hecho", precio: "6 €", categoria: "Tierras, abonos y macetas" }
      - { nombre: Macetas de barro, texto: "De 12 a 60 cm", precio: "desde 2 €", categoria: "Tierras, abonos y macetas" }
