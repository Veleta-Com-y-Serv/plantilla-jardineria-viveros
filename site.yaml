        lugar: Alcañiz
        superficie: "420 m²"
        imagen: /fotos/trabajo-jardin-seco.jpg
      - titulo: Zona verde de una comunidad
        texto: "Césped renovado, setos de laurel recortados y riego por aspersión con programador por zonas."
        lugar: Caspe
        superficie: "1.200 m²"
        imagen: /fotos/trabajo-comunidad.jpg
      - titulo: Huerto en bancales
        texto: "Seis bancales de pino tratado, tierra de cultivo y goteo. Una huerta que se riega sola."
        lugar: Calanda
