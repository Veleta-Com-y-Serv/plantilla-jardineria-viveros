  servicios:
    activa: true
    antetitulo: Servicios
    titulo: Del proyecto al mantenimiento
    texto: "Un solo equipo para todo el jardín: particulares, comunidades de vecinos y empresas."
    items:   # con `detalle`, cada servicio tiene su página en /servicios/<slug>/
      - titulo: Diseño y construcción de jardines
        texto: "Te dibujamos el jardín, preparamos la tierra, plantamos y dejamos el riego hecho."
        precio: "Presupuesto cerrado"
        imagen: /fotos/servicio-diseno.jpg
        imagenes: "/fotos/trabajo-jardin-seco.jpg; /fotos/trabajo-huerto.jpg"
        detalle: |
          Un jardín empieza por mirar lo que ya hay: cuánto sol le da, qué tierra tiene, por dónde se pasa y cuánta agua se puede gastar. Por eso lo primero es una visita, sin compromiso, en la que medimos y te preguntamos cómo quieres usarlo: para los niños, para sentarte a la sombra, para que se vea bonito desde la ventana o para que dé el menor trabajo posible.

          Con eso te preparamos un dibujo sencillo con las zonas, las plantas y el riego, y un presupuesto cerrado. Elegimos plantas que aguantan el clima del Bajo Aragón, con veranos secos y heladas en invierno, y muchas salen de nuestro propio vivero.

          Después hacemos la obra de principio a fin: limpieza del terreno, aporte de tierra vegetal, caminos de grava o losa, bordes, plantación y riego por goteo con programador. Al terminar te explicamos cómo cuidarlo y, si quieres, nos quedamos con el mantenimiento.
      - titulo: Mantenimiento de jardines
        texto: "Siega, poda de setos, abonado y revisión del riego, cada semana o cada quince días."
        precio: "desde 60 € al mes"
      - titulo: Podas y talas
        texto: "Frutales, olivos, setos y árboles grandes, con la herramienta y en la época que tocan."
        precio: "desde 35 €/hora"
        imagen: /fotos/servicio-poda.jpg
        imagenes: "/fotos/olivo-podado.jpg"
        detalle: |
          Una buena poda no se nota por lo que se corta, sino por cómo crece el árbol después. Podamos frutales, olivos, almendros, setos y árboles de sombra, cada uno en su momento: los frutales y los olivos con el árbol parado, de diciembre a marzo, y los setos varias veces al año para que no se abran.

          En los olivos aclaramos la copa para que entre la luz y el aire, quitamos los chupones y dejamos el árbol a una altura cómoda. En los frutales formamos la copa y quitamos la madera vieja para que den fruta buena y no solo hojas.

          Para los árboles grandes o peligrosos trabajamos con cuerdas y, cuando hace falta, con plataforma elevadora, y nos llevamos todos los restos. Si un árbol está enfermo o hay que talarlo, te lo decimos claro y te proponemos qué plantar en su lugar.
      - titulo: Césped natural y artificial
        texto: "Tepe, siembra o césped artificial bien drenado, según el uso y el agua que tengas."
        precio: "desde 9 €/m²"
        imagen: /fotos/servicio-cesped.jpg
        detalle: |
          Antes de poner césped conviene pensar cuánto se va a pisar y cuánta agua se le puede dar, porque en el Bajo Aragón el verano es largo. Te aconsejamos la mezcla que mejor aguanta aquí o, si prefieres olvidarte del riego, un césped artificial de calidad.

          Para el natural preparamos la tierra a fondo: quitamos piedras y raíces, nivelamos, añadimos tierra vegetal y abono de fondo y dejamos los aspersores colocados. Después ponemos el tepe, que se puede pisar en pocas semanas, o sembramos, que sale más barato y agarra muy bien en primavera y en otoño.

          El artificial lo colocamos sobre una base compactada y drenante, con malla antihierbas y juntas bien pegadas, para que el agua de lluvia se vaya y no salgan bultos. También renovamos céspedes viejos con calvas, escarificando, resembrando y ajustando el riego.
      - titulo: Riego automático
        texto: "Goteo y aspersión con programador, para regar lo justo y a la hora buena."
        precio: "desde 350 €"
        imagen: /fotos/servicio-riego.jpg
        detalle: |
          Con un buen riego automático el jardín recibe el agua que necesita y tú te olvidas de la manguera. Separamos el riego por zonas: goteo para los arbustos, los árboles y los bancales de huerta, y aspersión o difusores para el césped, cada zona con su tiempo y su horario.

          Instalamos programadores sencillos de manejar, también con sensor de lluvia o con control desde el móvil si lo quieres. Regamos de madrugada, cuando el agua se aprovecha más y no se evapora con el sol.

          Si ya tienes riego y no funciona bien, lo revisamos: cambiamos goteros atascados, aspersores rotos y electroválvulas, buscamos fugas y lo dejamos ajustado. En otoño vaciamos las tuberías que pueden helarse y en primavera lo ponemos en marcha otra vez.
      - titulo: Desbroces de fincas y solares
        texto: "Limpieza de parcelas, márgenes y solares, con retirada de los restos."
        precio: "Consultar"
      - titulo: Huertos
        texto: "Bancales elevados, tierra buena y goteo para que la huerta dé poco trabajo."
        precio: "desde 450 €"
    nota: "Precios orientativos con IVA. El precio cerrado te lo damos después de ver el jardín."
    cta: { texto: Pide presupuesto, url: "/#presupuesto" }

