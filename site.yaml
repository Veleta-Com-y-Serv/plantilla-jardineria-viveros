  calendario:
    activa: true
    antetitulo: El año en el jardín
    titulo: Qué toca hacer en cada época
    texto: "En el Bajo Aragón el verano aprieta y las heladas llegan pronto. Así repartimos el trabajo."
    tareas:   # `meses`: «noviembre a marzo», «marzo y octubre», «todo el año»…
      - { titulo: Poda de frutales y olivos, meses: "Diciembre a marzo", texto: "Con el árbol parado y sin heladas fuertes." }
      - { titulo: Plantar árboles y arbustos, meses: "Noviembre a marzo", texto: "La raíz agarra con las lluvias y llega fuerte al verano." }
      - { titulo: Césped nuevo, meses: "Marzo a mayo y septiembre a octubre", texto: "Ni el frío ni el calor lo frenan." }
      - { titulo: Plantel de huerta de verano, meses: "Abril a junio", texto: "Tomates, pimientos y calabacines, pasadas las heladas." }
      - { titulo: Revisión del riego, meses: "Marzo y octubre", texto: "Antes del calor, y antes de las heladas para vaciar tuberías." }
      - { titulo: Desbroces de fincas, meses: "Abril a junio", texto: "Antes de que la hierba se seque y haya riesgo de fuego." }

  sobre:
    activa: true
    antetitulo: Quiénes somos
    titulo: Una familia de jardineros en Alcañiz
    desde: "1994"
    declaracion: "Plantamos lo que aguanta aquí: olivo, almendro, lavanda y romero, con el agua justa."
    texto: |
      Pilar y Jesús abrieron el vivero en el Camino de la Estación y empezaron a hacer jardines para los vecinos. Hoy lo llevan con sus hijos y un equipo de cinco jardineros.

      Seguimos criando buena parte de la planta que ponemos, así que sabemos cómo se porta con el cierzo, el sol de agosto y las heladas de enero.
    imagen: /fotos/sobre.jpg
    items:
      - { titulo: Vivero propio, texto: "Lo que plantamos lo hemos criado aquí: ya conoce el clima." }
      - { titulo: El agua justa, texto: "Goteo, programador y plantas que no piden más agua de la que hay." }
      - { titulo: El mismo equipo, texto: "Quien te hace el jardín es quien luego lo cuida." }

  zonas:
    activa: true
    antetitulo: Dónde trabajamos
    titulo: Alcañiz y los pueblos de alrededor
    texto: "Vamos a unos 40 kilómetros a la redonda. Si tu pueblo no está, pregúntanos."
    titulo_pagina: "Jardinería en {zona}"
    texto_pagina: "Diseño, mantenimiento, podas y riego en {zona}. Vamos a ver tu jardín y te damos el precio por escrito, sin compromiso."
    items:   # las zonas con `texto` tienen su página en /zonas/<slug>/
      - titulo: Alcañiz
        texto: "Alcañiz es nuestra casa: aquí está el vivero, en el Camino de la Estación, y aquí hemos hecho la mayoría de nuestros jardines, desde patios del casco antiguo hasta chalets de las urbanizaciones de las afueras. Diseñamos jardines nuevos, cuidamos los de particulares y comunidades y podamos los olivos y frutales de las torres y huertos de la vega del Guadalope. Al estar tan cerca, podemos pasar a ver tu jardín casi en el día y atender una avería del riego sin esperas."
      - titulo: Calanda
        texto: "En Calanda trabajamos sobre todo en huertos y jardines de casas con terreno, muchos con frutales. Podamos melocotoneros, olivos y almendros en su época, montamos bancales con riego por goteo y hacemos el mantenimiento de jardines de segunda residencia, que en verano necesitan que alguien esté pendiente del riego. Pasamos por Calanda varias veces por semana, así que es fácil encajar una visita para ver tu jardín y darte el presupuesto."
      - titulo: Caspe
        texto: "En Caspe cuidamos zonas verdes de comunidades de vecinos y jardines de chalets cerca del embalse. El calor del verano aprieta aquí, así que ponemos especial cuidado en el riego: programadores por zonas, goteo en setos y arbustos y céspedes que aguantan. También hacemos desbroces de parcelas y solares antes del verano y renovamos jardines viejos para que pidan menos agua y menos trabajo."
      - titulo: Andorra
        texto: "En Andorra y los pueblos de la Sierra de Arcos hacemos jardines de casas y chalets pensados para inviernos fríos y veranos secos: arbustos que aguantan las heladas, céspedes resistentes y riego por goteo bien protegido. Podamos árboles grandes en calles y patios, limpiamos parcelas y nos encargamos del mantenimiento durante todo el año, con visitas cada semana o cada quince días según lo que necesite tu jardín."
      - { titulo: Valdealgorfa }
      - { titulo: Castelserás }
      - { titulo: Alcorisa }
      - { titulo: La Puebla de Híjar }

  opiniones:
    activa: true
    antetitulo: Opiniones
    titulo: Lo que dicen de nosotros
    testimonios:
      - { texto: "Nos hicieron el jardín de la casa con plantas que casi no hay que regar. Dos veranos después sigue precioso y la factura del agua ha bajado.", autor: Marta G., nota: Alcañiz }
      - { texto: "Llevan el jardín de nuestra comunidad desde hace años. Puntuales, limpios y siempre avisan antes de venir.", autor: Comunidad Los Pinos, nota: Caspe }
      - { texto: "Me podaron los olivos y los melocotoneros y me explicaron qué hacer el resto del año. Se nota que saben.", autor: Antonio L., nota: Calanda }

  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Lo que más nos preguntan
    preguntas:
      - { pregunta: "¿Cuánto cuesta el presupuesto?", respuesta: "Nada. Vamos a ver el jardín, te contamos qué haríamos y te mandamos el precio por escrito en una semana." }
      - { pregunta: "¿Hacéis mantenimiento a comunidades de vecinos?", respuesta: "Sí. Cuidamos zonas verdes de comunidades con visitas cada semana o cada quince días, y pasamos el parte de lo que hemos hecho." }
      - { pregunta: "¿Cuándo es mejor plantar un jardín nuevo?", respuesta: "En otoño y al final del invierno, de noviembre a marzo. La planta agarra con las lluvias y llega fuerte al verano." }
      - { pregunta: "¿Os lleváis los restos de poda?", respuesta: "Sí, siempre. Los restos van a una planta de compostaje y el jardín queda limpio al terminar." }
      - { pregunta: "¿Puedo comprar en el vivero aunque no me hagáis el jardín?", respuesta: "Claro. El vivero está abierto a todo el mundo y te aconsejamos qué planta va bien en tu casa y cómo cuidarla." }

  contacto:
    activa: true
    antetitulo: Contacto
    titulo: Cuéntanos qué jardín tienes
    texto: "Te respondemos en el día. Si puedes, mándanos una foto por WhatsApp."
